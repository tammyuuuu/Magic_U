<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#100c17"><link rel="stylesheet" href="magic-u.css?v=4"><link rel="stylesheet" href="daily-card.css?v=10"><link rel="stylesheet" href="app-nav.css?v=1"><title>每日一牌 · Magic_U</title><link rel="manifest" href="manifest.json?v=20260923"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260923"><link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=20260923"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-2026.png?v=20260923"></head>
<body class="daily-body"><main class="daily-shell">
  <header class="daily-top"><a href="index.html">‹ 返回主页</a><span>每日一牌</span></header>
  <section class="daily-stage locked-stage" id="lockedStage" hidden><div class="daily-sigil">◇</div><h1>每日一牌尚未开启</h1><p>完成黑猫的第一次考验后，这项能力会自然出现。</p><a class="primary-button" href="journey.html">返回塔罗之旅</a></section>
  <section class="daily-stage mood-stage" id="moodStage" hidden><p class="daily-eyebrow">Before the card</p><h1>抽牌前，你现在是什么感觉？</h1><p class="daily-subtle">只记录此刻，不需要分析它。</p><div class="mood-grid" id="moodChoices"></div><button class="primary-button" id="toDraw" type="button" disabled>继续</button></section>
  <section class="daily-stage draw-stage" id="drawStage" hidden><p class="daily-eyebrow">Today’s card</p><h1 id="drawTitle">让今天与一张牌相遇</h1><button class="reveal-card" id="drawCard" type="button" aria-label="点击翻开今天的牌"><span class="reveal-flipper"><span class="reveal-face reveal-back"><img id="backImage" alt="维特塔罗牌背"></span><span class="reveal-face reveal-front"><img id="revealImage" alt="今天抽到的塔罗牌"></span></span></button><p class="daily-subtle" id="moodRecall"></p><p class="flip-prompt" id="flipPrompt">点击牌背，亲自翻开</p><div class="reveal-identity" id="revealIdentity" hidden><h2><span id="revealNumberName"></span><small id="revealNameEn"></small></h2><span class="orientation" id="revealOrientation"></span><button class="primary-button" id="toReading" type="button">查看解读</button></div></section>
  <section class="daily-stage result-stage" id="resultStage" hidden>
    <div class="result-heading"><p class="daily-eyebrow">今天的牌</p><div><span id="resultMood"></span><span id="savedMark"></span></div></div>
    <div class="daily-result-main"><div class="daily-card result-card" id="resultCard"><img id="cardImage" alt="今天抽到的塔罗牌"></div><div class="result-copy"><div class="identity-line"><h1><span id="cardNumberName"></span><small id="cardNameEn"></small></h1><span class="orientation" id="orientation"></span></div><p class="daily-core" id="coreText"></p><div class="daily-message"><small>今日提示</small><p id="dailyText"></p></div></div></div>
    <div class="focus-area"><div class="focus-tabs" id="focusTabs"></div><p class="focus-copy" id="focusText"></p></div>
    <div class="remember-area"><h2>今天，有什么想记录的事吗？</h2><button class="note-toggle" id="noteToggle" type="button">＋ 记录今天的事</button><textarea id="noteInput" maxlength="240" placeholder="今天发生了什么，或者这张牌让你想到了什么？" hidden></textarea></div>
    <button class="primary-button save-daily" id="saveDaily" type="button">保存今日记录</button>
  </section>
</main><script src="decks.js?v=2"></script><script src="tarot_data.js"></script><script src="tarot_daily_content.js?v=1"></script><script src="tarot_minor_daily_content.js?v=1"></script><script src="daily-card.js?v=12"></script><script src="app-nav.js?v=2"></script></body></html>
