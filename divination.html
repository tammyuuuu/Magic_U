<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c17"><link rel="stylesheet" href="magic-u.css?v=3"><link rel="stylesheet" href="divination.css?v=1"><title>开始占卜 · Magic_U</title></head><body><main class="reading-shell">
<style>[hidden]{display:none!important}</style><header class="reading-top"><a href="index.html">‹ 返回主页</a><span>开始占卜</span></header>
<section class="reading-stage intro-stage" id="intro"><p class="eyebrow">A three-card reading</p><h1>时间之流</h1><p class="lead">把一个真实问题，放进过去、现在与未来的流动里。</p><label class="question-field"><span>这次想看的问题</span><textarea id="question" rows="2" maxlength="160" placeholder="写一句就好，也可以暂时不写"></textarea></label><div class="spread-preview"><span>过去</span><i>→</i><span>现在</span><i>→</i><span>未来</span></div><button class="primary-action" id="startDraw">开始抽牌</button></section>
<section class="reading-stage draw-stage" id="draw" hidden><div class="stage-copy"><p class="eyebrow">Draw your cards</p><h1>抽一张，放进牌位</h1><p id="drawHint">先为「过去」抽一张牌。</p></div><div class="spread-board" id="spreadBoard"></div><div class="fan-wrap" id="fanWrap" aria-label="牌堆"></div></section>
<section class="reading-stage reveal-stage" id="reveal" hidden><div class="stage-copy"><p class="eyebrow">Reveal</p><h1>逐张翻开</h1><p>点击牌背，看看每个位置出现了什么。</p></div><div class="spread-board reveal-board" id="revealBoard"></div><button class="primary-action compact" id="beginInterpret" disabled>开始解读</button></section>
<section class="reading-stage interpret-stage" id="interpret" hidden><div class="interpret-heading"><p class="eyebrow" id="positionEn"></p><h1><span id="positionZh"></span> · <span id="cardName"></span></h1><p id="positionPrompt"></p></div><div class="interpret-card-row"><div class="reading-card revealed" id="interpretCard"></div><span class="orientation" id="orientation"></span></div><label class="note-field"><span>这张牌放在这里，你怎样理解？</span><textarea id="positionNote" rows="3" maxlength="240" placeholder="写下此刻最直接的一句话"></textarea></label><button class="primary-action compact" id="nextInterpret">继续</button></section>
<section class="reading-stage done-stage" id="done" hidden><p class="eyebrow">Reading complete</p><h1>这次解读已经保存。</h1><p class="lead">三张牌和你的理解，已经放进「我的手册」。</p><a class="primary-action" href="handbook_readings.html">查看占卜记录</a><button class="text-action" id="again">再做一次</button></section>
</main><script src="decks.js?v=2"></script><script src="tarot_data.js"></script><script src="divination.js?v=1"></script></body></html>
