<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c17"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="stylesheet" href="magic-u.css?v=3"><link rel="stylesheet" href="home.css?v=2"><link rel="stylesheet" href="home-unlock.css?v=1"><link rel="stylesheet" href="app-nav.css?v=1"><title>Magic_U</title></head><body>
<main class="home-shell daily-home"><header class="compact-brand"><p class="eyebrow">Magic_U · Tarot</p><span aria-hidden="true">✦</span></header>
<section class="journey-entry" aria-labelledby="journeyEntryTitle"><div class="journey-orbit" aria-hidden="true"><i></i><span>✦</span></div><p class="section-kicker">The Tarot Journey</p><h2 id="journeyEntryTitle">塔罗之旅</h2><div class="current-progress"><span>序章 · 启程</span><strong>当前：看见</strong></div><a class="primary-action" href="journey.html">继续旅程</a></section>
<section class="tarot-tools home-tools" aria-labelledby="toolsTitle"><div class="section-heading"><p class="section-kicker">My Tarot</p><h2 id="toolsTitle">我的塔罗</h2><p>随着学习，逐渐获得属于你的塔罗能力。</p></div><div class="tool-grid"><article class="tool-tile locked" id="dailyCardTool" role="link" tabindex="0" aria-disabled="true"><span class="tool-symbol">☼</span><small id="dailyCardStatus">锁定</small><h3>今日一牌</h3><p>每天与一张牌相遇</p></article><article class="tool-tile handbook" id="handbookTool" role="link" tabindex="0"><span class="tool-symbol">◇</span><small class="handbook-count" id="handbookCount">0 / 78</small><h3>我的手册</h3><p>收藏你一路形成的理解</p></article><article class="tool-tile locked" id="spreadTool" role="link" tabindex="0" aria-disabled="true"><span class="tool-symbol">✣</span><small id="spreadStatus">锁定</small><h3>牌阵练习</h3><p>学会牌与牌之间的关系</p></article><article class="tool-tile locked"><span class="tool-symbol">✦</span><small>锁定</small><h3>开始占卜</h3><p>带着问题，完成自己的解读</p></article></div></section></main>
<script>if(localStorage.getItem('magic_u_lesson_see_completed'))document.getElementById('handbookCount').textContent='1 / 78';const handbookTool=document.getElementById('handbookTool'),openHandbook=()=>location.href='handbook.html';handbookTool.addEventListener('click',openHandbook);handbookTool.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openHandbook()}});const makeLink=(tile,url)=>{tile.classList.remove('locked');tile.classList.add('available');tile.setAttribute('aria-disabled','false');const open=()=>location.href=url;tile.addEventListener('click',open);tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})};const dailyTool=document.getElementById('dailyCardTool');if(localStorage.getItem('magic_u_boss_black_cat_completed')){document.getElementById('dailyCardStatus').textContent='已解锁';makeLink(dailyTool,'daily_card.html')}const dailyRecords=(()=>{try{return Object.values(JSON.parse(localStorage.getItem('magic_u_daily_records_v1_records')||'{}'))}catch{return []}})();if(localStorage.getItem('magic_u_spread_practice_unlocked')||dailyRecords.some(item=>item&&item.saved)){const spreadTool=document.getElementById('spreadTool');document.getElementById('spreadStatus').textContent='已解锁';makeLink(spreadTool,'spread_practice.html')}</script><script src="app-nav.js?v=2"></script></body></html>
