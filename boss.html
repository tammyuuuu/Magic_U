<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#100c17"><link rel="stylesheet" href="magic-u.css?v=4"><link rel="stylesheet" href="boss.css?v=2"><link rel="stylesheet" href="boss-layout.css?v=2"><title>黑猫的考验 · Magic_U</title><link rel="manifest" href="manifest.json?v=20260923"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260923"><link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=20260923"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-2026.png?v=20260923"></head>
<body class="boss-body"><main class="boss-shell"><header class="boss-top"><a class="boss-back" href="journey.html">‹ 塔罗之旅</a><span class="boss-title">Boss · 黑猫的考验</span></header>
<section class="boss-panel boss-intro" id="introPanel"><div class="cat-wrap"><span class="cat-glow"></span><span class="black-cat"><span class="cat-eyes-boss"><i></i><i></i></span><span class="cat-tail"></span></span></div><h1>黑猫的考验</h1><p class="cat-speech">都看到这里了。<br>让我看看你记住多少。</p><button class="primary-button" id="startBoss" type="button">开始考验</button></section>
<section class="boss-panel boss-quiz" id="quizPanel" hidden><div class="boss-progress" id="bossProgress" aria-label="考验进度"></div><div class="examiner"><div class="cat-wrap" id="quizCat"><span class="cat-glow"></span><span class="black-cat"><span class="cat-eyes-boss"><i></i><i></i></span><span class="cat-tail"></span></span></div><div class="examiner-copy"><small>黑猫</small><p id="catFeedback"></p></div></div><section class="question-area"><p class="question-type" id="questionType"></p><h1 id="questionPrompt"></h1><div class="question-card" id="questionCard" hidden><img id="questionImage" alt="题目中的塔罗牌"></div><div class="boss-options" id="bossOptions"></div><p class="boss-hint" id="bossHint"></p></section></section>
<section class="boss-panel boss-complete" id="completePanel" hidden><div class="cat-wrap correct"><span class="cat-glow"></span><span class="black-cat"><span class="cat-eyes-boss"><i></i><i></i></span><span class="cat-tail"></span></span></div><p class="cat-speech" id="finalVerdict">……</p><h1>黑猫的考验 · 完成</h1><p>前五张牌，你确实有认真看。</p><a class="primary-button" href="journey.html">返回塔罗之旅</a></section></main>
<script src="boss_data.js?v=1"></script><script src="boss_data_stage2.js?v=1"></script><script src="boss_data_stage3.js?v=1"></script><script>
const BOSS_STAGE=Number(new URLSearchParams(location.search).get('stage')||1);
const BOSS_KEY=BOSS_STAGE===3?'magic_u_boss_three_major_completed':BOSS_STAGE===2?'magic_u_boss_two_completed':'magic_u_boss_black_cat_completed',QUESTION_BANK=BOSS_STAGE===3?BOSS_THREE_QUESTIONS:BOSS_STAGE===2?BOSS_TWO_QUESTIONS:BOSS_QUESTIONS,TYPES=['recognize','element','inference','concept','scenario'];
const TYPE_NAMES={recognize:'认牌',element:'寻找画面',inference:'从画面推理',concept:'区分概念',scenario:'情境选牌'};
const CARD_NAMES=['愚人','魔术师','女祭司','皇后','皇帝','教皇','恋人','战车','力量','隐者','命运之轮','正义','倒吊人','死神','节制','恶魔','高塔','星星','月亮','太阳','审判','世界'];
const firstRight=['嗯。','……还记得嘛。','看来不是碰巧。'],retryRight=['这次记住了。','嗯。'];
const panels=[...document.querySelectorAll('.boss-panel')],state={questions:[],index:0,solved:0,records:[]};
function show(panel){panels.forEach(item=>item.hidden=item!==panel)}
function shuffled(items){return [...items].sort(()=>Math.random()-.5)}
function chooseQuestions(){return TYPES.map(type=>shuffled(QUESTION_BANK.filter(q=>q.type===type))[0])}
function cardPath(id){return `图片/盒子/维特塔罗/${id}.webp`}
function setCatState(name){document.getElementById('quizCat').className=`cat-wrap${name?' '+name:''}`}
function renderProgress(){document.getElementById('bossProgress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<state.solved?'solved':''}">${i<state.solved?'✦':'◇'}</span>`).join('')}
function optionsFor(q){if(q.type==='recognize')return q.cards.map(id=>({value:String(id),label:CARD_NAMES[id],cardId:id}));return q.options.map(([value,label])=>({value,label}))}
function renderQuestion(){const q=state.questions[state.index];q.attempts=0;q.usedHint=false;renderProgress();setCatState('');document.getElementById('catFeedback').textContent=state.index===4?'最后一个。':q.host;document.getElementById('questionType').textContent=`考验 ${state.index+1} · ${TYPE_NAMES[q.type]}`;document.getElementById('questionPrompt').textContent=q.prompt;const card=document.getElementById('questionCard');card.hidden=q.cardId===undefined;if(!card.hidden)document.getElementById('questionImage').src=cardPath(q.cardId);const options=shuffled(optionsFor(q)),box=document.getElementById('bossOptions');box.className=`boss-options${q.type==='recognize'?' card-options':''}`;box.innerHTML=options.map(o=>q.type==='recognize'?`<button class="boss-option card-answer" type="button" data-value="${o.value}"><img src="${cardPath(o.cardId)}" alt="${o.label}"><span>${o.label}</span></button>`:`<button class="boss-option" type="button" data-value="${o.value}">${o.label}</button>`).join('');document.getElementById('bossHint').textContent=''}
function resolveQuestion(button){const q=state.questions[state.index];q.attempts++;if(button.dataset.value===q.answer){button.classList.add('is-correct');document.querySelectorAll('.boss-option').forEach(item=>item.disabled=true);setCatState('correct');document.getElementById('catFeedback').textContent=q.attempts===1?firstRight[Math.floor(Math.random()*firstRight.length)]:retryRight[Math.floor(Math.random()*retryRight.length)];state.records.push({id:q.id,attempts:q.attempts,firstTry:q.attempts===1,usedHint:q.usedHint});window.setTimeout(()=>{state.solved++;state.index++;if(state.index<5)renderQuestion();else finishBoss()},650)}else{button.classList.add('is-wrong');button.disabled=true;setCatState(q.attempts>=2?'hint':'wrong');if(q.attempts===1)document.getElementById('catFeedback').textContent=q.cardId!==undefined?'再看看牌面。':'……再想想。';else{q.usedHint=true;document.getElementById('catFeedback').textContent='行吧，给你一点提示。';document.getElementById('bossHint').textContent=`提示：${q.hint}`}}}
function finishBoss(){renderProgress();localStorage.setItem(BOSS_KEY,JSON.stringify({completed:true,completedAt:new Date().toISOString(),questions:state.records}));show(document.getElementById('completePanel'));window.setTimeout(()=>document.getElementById('finalVerdict').textContent='看来前面的牌，你确实有认真看。',500);window.setTimeout(()=>document.getElementById('finalVerdict').textContent='行吧，这次算你通过。',1450)}
document.getElementById('startBoss').addEventListener('click',()=>{state.questions=chooseQuestions();show(document.getElementById('quizPanel'));renderQuestion()});document.getElementById('bossOptions').addEventListener('click',event=>{const button=event.target.closest('.boss-option');if(button&&!button.disabled)resolveQuestion(button)});
if(BOSS_STAGE===2){document.title='黑猫的考验 II · Magic_U';document.querySelector('.boss-title').textContent='Boss II · 黑猫的考验';document.querySelector('.boss-intro h1').textContent='黑猫的考验 II';document.querySelector('.boss-intro .cat-speech').innerHTML='又见面了。<br>前面的牌，也别忘了。';document.querySelector('.boss-complete h1').textContent='黑猫的考验 II · 完成';document.querySelector('.boss-complete>p:not(.cat-speech)').textContent='从愚人到命运之轮，你已经能重新辨认它们。'}
if(BOSS_STAGE===3){document.title='黑猫的考验 III · Magic_U';document.querySelector('.boss-title').textContent='Boss III · 黑猫的考验';document.querySelector('.boss-intro h1').textContent='大阿卡那的考验';document.querySelector('.boss-intro .cat-speech').innerHTML='一路走到世界了。<br>那就看看，你是不是真的会看。';document.querySelector('.boss-complete h1').textContent='大阿卡那的考验 · 完成';document.querySelector('.boss-complete>p:not(.cat-speech)').textContent='从愚人到世界，你已经走完了第一段塔罗旅程。'}
</script></body></html>
